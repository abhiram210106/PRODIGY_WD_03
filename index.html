<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>Tic-Tac-Toe — Prodigy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-glow glow-1"></div>
  <div class="bg-glow glow-2"></div>

  <main class="app" role="main">
    <header class="header">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="3"/>
            <line x1="9" y1="3" x2="9" y2="21"/>
            <line x1="15" y1="3" x2="15" y2="21"/>
            <line x1="3" y1="9" x2="21" y2="9"/>
            <line x1="3" y1="15" x2="21" y2="15"/>
          </svg>
        </span>
        <span class="brand-text">Tic<span class="accent">Tac</span>Toe</span>
      </div>
      <div class="mode-toggle" role="group" aria-label="Game mode">
        <button type="button" class="mode-btn active" data-mode="pvp" aria-pressed="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>Two Player</span>
        </button>
        <button type="button" class="mode-btn" data-mode="ai" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/><path d="M9 9h6"/><path d="M9 13h6"/></svg>
          <span>vs AI</span>
        </button>
      </div>
    </header>

    <section class="status-bar" aria-live="polite" aria-atomic="true">
      <div class="score-board">
        <div class="score-item" data-player="X">
          <span class="score-label">Player X</span>
          <span class="score-value" id="scoreX">0</span>
          <span class="score-marker" aria-hidden="true"></span>
        </div>
        <div class="turn-indicator" id="turnIndicator">
          <span class="turn-text">Player <strong id="currentPlayer">X</strong>'s turn</span>
          <div class="turn-dot" aria-hidden="true"></div>
        </div>
        <div class="score-item" data-player="O">
          <span class="score-label" id="labelO">Player O</span>
          <span class="score-value" id="scoreO">0</span>
          <span class="score-marker" aria-hidden="true"></span>
        </div>
      </div>
    </section>

    <section class="game-area">
      <div class="board-wrapper">
        <div class="board" id="board" role="grid" aria-label="Tic-Tac-Toe board">
          <button type="button" class="cell" data-index="0" role="gridcell" aria-label="Row 1, Column 1"></button>
          <button type="button" class="cell" data-index="1" role="gridcell" aria-label="Row 1, Column 2"></button>
          <button type="button" class="cell" data-index="2" role="gridcell" aria-label="Row 1, Column 3"></button>
          <button type="button" class="cell" data-index="3" role="gridcell" aria-label="Row 2, Column 1"></button>
          <button type="button" class="cell" data-index="4" role="gridcell" aria-label="Row 2, Column 2"></button>
          <button type="button" class="cell" data-index="5" role="gridcell" aria-label="Row 2, Column 3"></button>
          <button type="button" class="cell" data-index="6" role="gridcell" aria-label="Row 3, Column 1"></button>
          <button type="button" class="cell" data-index="7" role="gridcell" aria-label="Row 3, Column 2"></button>
          <button type="button" class="cell" data-index="8" role="gridcell" aria-label="Row 3, Column 3"></button>
        </div>
        <div class="win-line" id="winLine" aria-hidden="true"></div>
      </div>

      <div class="game-controls">
        <button type="button" class="btn btn-primary" id="restartBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          <span>Restart Game</span>
        </button>
        <button type="button" class="btn btn-secondary" id="resetScoreBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          <span>Reset Score</span>
        </button>
      </div>
    </section>

    <footer class="footer">
      <p>PRODIGY WD-03 <span class="dot" aria-hidden="true"></span> Tic-Tac-Toe Web Application</p>
    </footer>
  </main>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
    <div class="modal-backdrop" tabindex="-1"></div>
    <div class="modal-content">
      <div class="modal-icon" id="modalIcon" aria-hidden="true"></div>
      <h2 id="modalTitle"></h2>
      <p id="modalMessage"></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-primary" id="modalPlayAgain">Play Again</button>
        <button type="button" class="btn btn-ghost" id="modalClose">Close</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <script src="script.js"></script>
</body>
</html>
